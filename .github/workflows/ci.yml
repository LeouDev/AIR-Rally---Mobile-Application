name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      # A cold runner takes over jest's 5s default to render the heaviest
      # screens for the first time (1.3s locally); 30s still catches a hang.
      - run: npx jest --ci --testTimeout=30000
